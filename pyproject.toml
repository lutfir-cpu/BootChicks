[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootchicks"
version = "0.2.0"
description = "Two-round airport disruption negotiation simulator"
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.2", "anthropic==1.17.0", "fastapi==0.162.0", "uvicorn==0.54.0", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "httpx==0.28.1", "ruff>=0.17,<1"]
legacy-ui = ["streamlit>=1.66,<2", "pandas>=2.2,<4"]

[project.scripts]
bootchicks = "bootchicks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "frontend/tests"]
pythonpath = ["src", "frontend"]

[tool.ruff]
src = ["src", "frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "C4"]
